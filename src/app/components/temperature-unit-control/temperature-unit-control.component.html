<mat-button-toggle-group
  class="unit-control"
  [value]="selectedUnit"
  aria-label="Temperature unit"
  ><mat-button-toggle value="C" aria-label="Celsius" (click)="selectUnit('C')"
    >C</mat-button-toggle
  ><mat-button-toggle
    value="F"
    aria-label="Fahrenheit"
    (click)="selectUnit('F')"
    >F</mat-button-toggle
  ></mat-button-toggle-group
>
