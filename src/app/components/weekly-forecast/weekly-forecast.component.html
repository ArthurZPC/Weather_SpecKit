<section aria-labelledby="weekly-heading">
  <div class="section-heading">
    <h2 id="weekly-heading">Weekly forecast</h2>
  </div>
  <div class="forecast-grid">
    @for (day of forecast; track day.weekdayShort) {
      <mat-card class="forecast-card" appearance="outlined"
        ><span class="day-label">{{ day.weekdayShort }}</span
        ><img
          class="forecast-icon"
          [src]="weatherStateVisuals[day.condition].iconPath"
          [alt]="weatherStateVisuals[day.condition].description"
          (error)="handleImageError($event)"
        />
        <div class="temps">
          <strong>{{ formatTemperature(day.highCelsius, unit) }}</strong
          ><span>{{ formatTemperature(day.lowCelsius, unit) }}</span>
        </div></mat-card
      >
    }
  </div>
</section>
